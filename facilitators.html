<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facilitators — Smiling Home Islamic Institute</title>
<link rel="icon" type="image/jpeg" href="assets/images/logo.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="sheet facilitators-sheet">
    <header class="letterhead">
      <div class="logo-slot">
        <img src="assets/images/logo.jpg" alt="Smiling Home logo" style="width:100%;height:100%;object-fit:contain;border-radius:50%;">
      </div>
      <div class="org-text">
        <h1>Smiling Home Islamic Institute</h1>
        <p>Course Facilitators</p>
      </div>
    </header>

    <nav class="site-nav" aria-label="Primary navigation">
      <a href="registration-form.html">Course registration</a>
    </nav>

    <section class="facilitators-content" aria-labelledby="facilitators-title">
      <p class="eyebrow">Learn from experienced teachers</p>
      <h2 id="facilitators-title">Meet our facilitators</h2>
      <p class="facilitators-intro">We are honoured to welcome these knowledgeable facilitators to the programme.</p>

      <div class="facilitator-grid">
        <figure class="facilitator-card">
          <img src="assets/images/facilitators/facilitator%201.jpg" alt="Alhaji Imam Saeed Abdullah and his biography" loading="eager">
          <figcaption>Alhaji Imam Saeed Abdullah</figcaption>
        </figure>
        <figure class="facilitator-card">
          <img src="assets/images/facilitators/facilitator%202.jpg" alt="Imam Abdul Kabir Tanko and his biography" loading="lazy">
          <figcaption>Imam Abdul Kabir Tanko</figcaption>
        </figure>
        <figure class="facilitator-card">
          <img src="assets/images/facilitators/facilitator%203.jpg" alt="Ustaaz Abubakar Qassim and his biography" loading="lazy">
          <figcaption>Ustaaz Abubakar Qassim</figcaption>
        </figure>
      </div>

      <a class="facilitators-register-link" href="registration-form.html">Register for the course</a>
    </section>
  </main>
</body>
</html>
